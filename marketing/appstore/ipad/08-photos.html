<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css"><link rel="stylesheet" href="../ipad.css">
</head><body>
<div class="canvas">
  <div class="wash blue" style="width:1100px;height:1100px;top:-360px;left:-340px"></div>
  <div class="wash mint" style="width:1100px;height:1100px;bottom:-260px;right:-340px"></div>

  <div class="head">
    <div class="eyebrow">Proof you can see</div>
    <h1>See it happen,<br>week by week.</h1>
    <div class="sub">Guided progress photos — <strong>same pose, same angle, every week</strong> — lined up so the change is undeniable.</div>
  </div>

  <div class="stage" style="top:880px">
    <div class="phone"><div class="screen" style="background:#15181b">
      <div style="position:absolute;inset:0;background:
        radial-gradient(140% 100% at 50% 0%, #2a3034 0%, #1b1f22 55%, #101315 100%)"></div>
      <div class="island"></div>
      <div class="sbar light" style="position:relative;z-index:20">
        <span class="time">9:41</span>
        <svg width="68" height="13" viewBox="0 0 68 13" fill="none">
          <rect x="0" y="6" width="3" height="6" rx="1" fill="#fff"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/>
          <path d="M28 4.5a8.5 8.5 0 0 1 11 0l-1.6 1.9a6 6 0 0 0-7.8 0L28 4.5zm2.8 3.2a4.5 4.5 0 0 1 5.4 0l-1.6 2a2 2 0 0 0-2.2 0l-1.6-2zm2.7 3.3.9 1 .9-1a1.4 1.4 0 0 0-1.8 0z" fill="#fff"/>
          <rect x="46" y="1" width="20" height="11" rx="3.5" stroke="#fff" stroke-opacity=".5"/><rect x="48" y="3" width="14" height="7" rx="2" fill="#fff"/><path d="M67.5 4.5v4a2 2 0 0 0 0-4z" fill="#fff" fill-opacity=".5"/>
        </svg>
      </div>

      <div style="position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 20px">
        <span style="width:34px;height:34px;border-radius:17px;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center">
          <svg width="15" height="15" viewBox="0 0 15 15" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2.5 2.5l10 10M12.5 2.5l-10 10"/></svg>
        </span>
        <span style="font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,.4);padding:8px 16px;border-radius:17px">Week 4</span>
        <span style="width:34px;height:34px;border-radius:17px;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 13h6l-1 9 9-12h-6z"/></svg>
        </span>
      </div>

      <!-- pose silhouette guide -->
      <svg width="393" height="500" viewBox="0 0 393 500" style="position:absolute;top:140px;left:0;z-index:10">
        <g fill="rgba(255,255,255,.20)" stroke="rgba(255,255,255,.6)" stroke-width="2.5">
          <circle cx="196" cy="60" r="36"/>
          <path d="M160 110h72c20 0 32 14 34 32l12 96c2 14-18 18-22 4l-16-68v120l16 128c2 16-20 20-24 4l-18-116h-8l-18 116c-4 16-26 12-24-4l16-128V174l-16 68c-4 14-24 10-22-4l12-96c2-18 14-32 34-32z"/>

          <path d="M343 470v16a10 10 0 0 1-10 10h-18"/><path d="M78 496H60a10 10 0 0 1-10-10v-16"/>
        </g>
        <text x="196" y="480" text-anchor="middle" font-family="Geist" font-size="13" font-weight="600" fill="rgba(255,255,255,.75)">Line up with the guide</text>
      </svg>

      <!-- pose tabs + controls -->
      <div style="position:absolute;z-index:20;left:0;right:0;bottom:118px;display:flex;justify-content:center;gap:8px">
        <span style="font-size:13px;font-weight:700;color:#0b120d;background:#7FE3AB;padding:9px 22px;border-radius:18px">Front</span>
        <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,.75);border:1.5px solid rgba(255,255,255,.3);padding:8px 22px;border-radius:18px">Side</span>
        <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,.75);border:1.5px solid rgba(255,255,255,.3);padding:8px 22px;border-radius:18px">Back</span>
      </div>
      <div style="position:absolute;z-index:20;left:0;right:0;bottom:28px;display:flex;align-items:center;justify-content:space-between;padding:0 44px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
        <span style="width:72px;height:72px;border-radius:36px;border:4px solid #fff;display:flex;align-items:center;justify-content:center">
          <span style="width:56px;height:56px;border-radius:28px;background:#fff"></span>
        </span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
      </div>
    </div></div>
  </div>

  <!-- comparison float -->
  <div class="float" style="top:1220px;right:40px;padding:22px 28px;gap:14px">
    <div style="text-align:center">
      <div style="width:110px;height:140px;border-radius:18px;background:linear-gradient(180deg,#3a4046,#23282c);display:flex;align-items:flex-end;justify-content:center;overflow:hidden">
        <svg width="84" height="116" viewBox="0 0 84 116"><g fill="rgba(255,255,255,.30)"><circle cx="42" cy="16" r="11"/><path d="M30 31h24c7 0 10 5 11 11l3 26c1 5-6 6-7 1l-5-18v28l4 32c1 5-7 7-8 1l-6-28h-2l-6 28c-1 6-9 4-8-1l4-32V51l-5 18c-1 5-8 4-7-1l3-26c1-6 4-11 11-11z"/></g></svg>
      </div>
      <small style="display:block;margin-top:10px;font-size:20px;font-weight:600;color:#6E6F6A">Week 1</small>
    </div>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F9E63" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <div style="text-align:center">
      <div style="width:110px;height:140px;border-radius:18px;background:linear-gradient(180deg,#3a4046,#23282c);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border:3px solid #2FB87A">
        <svg width="84" height="116" viewBox="0 0 84 116"><g fill="rgba(255,255,255,.34)"><circle cx="42" cy="16" r="11"/><path d="M33 31h18c6 0 9 5 10 11l3 26c1 5-6 6-7 1l-5-18v28l4 32c1 5-7 7-8 1l-5-28h-2l-5 28c-1 6-9 4-8-1l4-32V51l-5 18c-1 5-8 4-7-1l3-26c1-6 4-11 10-11z"/></g></svg>
      </div>
      <small style="display:block;margin-top:10px;font-size:20px;font-weight:600;color:#1F9E63">Week 12</small>
    </div>
  </div>
  <div class="float" style="top:1330px;left:40px">
    <span class="fi"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 8h3l1.8-2.5h6.4L17 8h3v11H4z"/><circle cx="12" cy="13" r="3"/></svg></span>
    <div>Front, side, back<small>Auto-reminded every week</small></div>
  </div>
</div>
</body></html>
