<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Leanient standalone brand icon: the pen mark (white variant) centered on the
       brand emerald gradient, app-icon proportions. Mark geometry is 1:1 from
       design/onboarding.html logoMark(size, white=true). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ECF8B"/>
      <stop offset="0.56" stop-color="#2DB87A"/>
      <stop offset="1" stop-color="#1F9E63"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square ground (iOS-style ~22% radius) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- subtle top-left sheen for depth -->
  <rect width="1024" height="1024" rx="224" fill="url(#sheen)"/>

  <!-- pen mark, white body, centered. Native viewBox 0 0 36 48 scaled x13 -->
  <g transform="translate(278, 200) scale(13)">
    <!-- pen barrel -->
    <rect x="11" y="2" width="14" height="29" rx="7" fill="#FFFFFF"/>
    <!-- dose graduation ticks -->
    <g stroke="#239E64" stroke-width="2" stroke-linecap="round">
      <path d="M18.5 16h4"/>
      <path d="M18.5 20.5h4"/>
      <path d="M18.5 25h4"/>
    </g>
    <!-- needle hub + needle -->
    <rect x="13.8" y="30.5" width="8.4" height="3.4" rx="1.7" fill="#FFFFFF"/>
    <rect x="16.6" y="33.5" width="2.8" height="12.5" rx="1.4" fill="#FFFFFF"/>
  </g>
</svg>
