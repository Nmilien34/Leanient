<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Splash mint background gradient (splashTop -> splashMid -> splashBottom) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4FAF6"/>
      <stop offset="0.56" stop-color="#E5F3EB"/>
      <stop offset="1" stop-color="#D4EBDE"/>
    </linearGradient>
    <!-- Soft center glow to lift the artwork -->
    <radialGradient id="glow" cx="512" cy="470" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft contact shadow under the artwork -->
    <radialGradient id="shadow" cx="512" cy="812" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F9E63" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1F9E63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vialB" x1="14" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F2EB"/>
    </linearGradient>
    <linearGradient id="penB" x1="19" y1="0" x2="35" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F2EB"/>
    </linearGradient>
  </defs>

  <!-- Background (full-bleed, opaque; iOS applies the corner mask) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>
  <ellipse cx="512" cy="812" rx="250" ry="70" fill="url(#shadow)"/>

  <!-- Vial + syringe artwork, ported 1:1 from SplashArt and scaled to the canvas -->
  <g transform="translate(362,214) scale(3)">
    <!-- Vial (behind, rotated +6deg) -->
    <g transform="translate(0,96) rotate(6 32 50)">
      <rect x="22" y="2" width="20" height="12" rx="3" fill="#1F9E63"/>
      <rect x="25" y="13" width="14" height="7" fill="#CFE6D7"/>
      <rect x="14" y="19" width="36" height="78" rx="12" fill="url(#vialB)" stroke="#CFE6D7" stroke-width="1.5"/>
      <path d="M16 62h32v23a10 10 0 0 1-10 10H26a10 10 0 0 1-10-10V62Z" fill="#2FB87A" opacity="0.92"/>
      <rect x="18" y="40" width="28" height="16" rx="3" fill="#FFFFFF" opacity="0.9"/>
      <rect x="22" y="45" width="20" height="2.4" rx="1.2" fill="#9AD9B6"/>
      <rect x="22" y="50" width="13" height="2.4" rx="1.2" fill="#D2E7D9"/>
      <rect x="18.5" y="25" width="3.5" height="62" rx="2" fill="#FFFFFF" opacity="0.7"/>
    </g>

    <!-- Syringe (front, rotated -7deg) -->
    <g transform="translate(44,0) rotate(-7 27 99)">
      <rect x="15" y="2" width="24" height="6" rx="3" fill="#2FB87A"/>
      <rect x="24" y="8" width="6" height="33" rx="3" fill="#2FB87A"/>
      <rect x="11" y="39" width="32" height="7" rx="3.5" fill="#1F9E63"/>
      <rect x="19" y="46" width="16" height="99" rx="4" fill="url(#penB)" stroke="#CFE6D7" stroke-width="1.5"/>
      <path d="M20.2 101H33.8v38a3 3 0 0 1-3 3H23.2a3 3 0 0 1-3-3Z" fill="#2FB87A" opacity="0.9"/>
      <g stroke="#BFD9C8" stroke-width="1.4" stroke-linecap="round">
        <path d="M29 60h5"/>
        <path d="M30.5 72h3.5"/>
        <path d="M29 84h5"/>
        <path d="M30.5 96h3.5"/>
      </g>
      <path d="M22.5 145h9l-1.7 9h-5.6Z" fill="#CFE6D7"/>
      <rect x="26.2" y="153" width="1.6" height="42" rx="0.8" fill="#A9BFB2"/>
      <rect x="21.5" y="52" width="3" height="84" rx="1.5" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>
</svg>
