<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Leanient standalone square brand logo: the syringe + vial art (same as the
       current app icon / splash hero), vector-rebuilt 1:1 from
       design/onboarding.html (.splash-hero ill-vial + ill-pen, with their
       rotate/overlap arrangement) so it scales cleanly for all branding. -->
  <defs>
    <radialGradient id="ground" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#F4FAF5"/>
      <stop offset="1" stop-color="#DFEDE3"/>
    </radialGradient>
    <linearGradient id="vialB" x1="14" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F2EB"/>
    </linearGradient>
    <linearGradient id="penB" x1="19" y1="0" x2="35" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F2EB"/>
    </linearGradient>
  </defs>

  <!-- soft sage ground -->
  <rect width="1024" height="1024" fill="url(#ground)"/>

  <!-- grounding shadow ellipse -->
  <ellipse cx="512" cy="762" rx="300" ry="58" fill="#1F6E46" opacity="0.10"/>
  <ellipse cx="512" cy="754" rx="190" ry="36" fill="#1F6E46" opacity="0.07"/>

  <!-- hero art, bottoms grounded on the shadow, scaled 2.7x, centered -->
  <g transform="translate(377, 772) scale(2.7)">

    <!-- vial (behind, tilted +6deg, overlapping the pen) -->
    <g transform="rotate(6 32 -52) translate(0 -102)">
      <rect x="22" y="2" width="20" height="12" rx="3" fill="#1F9E63"/>
      <rect x="25" y="13" width="14" height="7" fill="#CFE6D7"/>
      <rect x="14" y="19" width="36" height="78" rx="12" fill="url(#vialB)" stroke="#CFE6D7" stroke-width="1.5"/>
      <path d="M16 62h32v23a10 10 0 0 1-10 10H26a10 10 0 0 1-10-10V62Z" fill="#2FB87A" opacity=".92"/>
      <rect x="18" y="40" width="28" height="16" rx="3" fill="#FFFFFF" opacity=".9"/>
      <rect x="22" y="45" width="20" height="2.4" rx="1.2" fill="#9AD9B6"/>
      <rect x="22" y="50" width="13" height="2.4" rx="1.2" fill="#D2E7D9"/>
      <rect x="18.5" y="25" width="3.5" height="62" rx="2" fill="#FFFFFF" opacity=".7"/>
    </g>

    <!-- syringe (front, tilted -7deg) -->
    <g transform="rotate(-7 73 -99) translate(46 -198)">
      <!-- plunger thumb rest + rod -->
      <rect x="15" y="2" width="24" height="6" rx="3" fill="#2FB87A"/>
      <rect x="24" y="8" width="6" height="33" rx="3" fill="#2FB87A"/>
      <!-- finger flange -->
      <rect x="11" y="39" width="32" height="7" rx="3.5" fill="#1F9E63"/>
      <!-- barrel -->
      <rect x="19" y="46" width="16" height="99" rx="4" fill="url(#penB)" stroke="#CFE6D7" stroke-width="1.5"/>
      <!-- medication -->
      <path d="M20.2 101H33.8v38a3 3 0 0 1-3 3H23.2a3 3 0 0 1-3-3Z" fill="#2FB87A" opacity=".9"/>
      <!-- graduation marks -->
      <g stroke="#BFD9C8" stroke-width="1.4" stroke-linecap="round">
        <path d="M29 60h5"/>
        <path d="M30.5 72h3.5"/>
        <path d="M29 84h5"/>
        <path d="M30.5 96h3.5"/>
      </g>
      <!-- needle hub + needle -->
      <path d="M22.5 145h9l-1.7 9h-5.6Z" fill="#CFE6D7"/>
      <rect x="26.2" y="153" width="1.6" height="42" rx="0.8" fill="#A9BFB2"/>
      <!-- highlight -->
      <rect x="21.5" y="52" width="3" height="84" rx="1.5" fill="#FFFFFF" opacity=".6"/>
    </g>
  </g>
</svg>
