<svg width="360" height="480" viewBox="0 0 36 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Leanient mark: injection pen (barrel + dose graduation ticks + needle).
       Extracted from design/onboarding.html logoMark(). Gradient body, for light grounds. -->
  <defs>
    <linearGradient id="leanient-lg" x1="8" y1="2" x2="28" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FE0A6"/>
      <stop offset="1" stop-color="#23A869"/>
    </linearGradient>
  </defs>
  <!-- pen barrel -->
  <rect x="11" y="2" width="14" height="29" rx="7" fill="url(#leanient-lg)"/>
  <!-- dose graduation ticks -->
  <g stroke="#F4FBF7" stroke-width="2" stroke-linecap="round" opacity=".92">
    <path d="M18.5 16h4"/>
    <path d="M18.5 20.5h4"/>
    <path d="M18.5 25h4"/>
  </g>
  <!-- needle hub + needle -->
  <rect x="13.8" y="30.5" width="8.4" height="3.4" rx="1.7" fill="url(#leanient-lg)"/>
  <rect x="16.6" y="33.5" width="2.8" height="12.5" rx="1.4" fill="url(#leanient-lg)"/>
</svg>
